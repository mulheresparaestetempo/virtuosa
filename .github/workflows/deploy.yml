name: Build and publish Site + App FILHA

on:
  push:
    branches:
      - claude/new-session-au1ezt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-filha/package-lock.json

      - name: Install App FILHA dependencies
        working-directory: app-filha
        run: npm ci

      - name: Build App FILHA for web
        working-directory: app-filha
        run: npx expo export -p web

      - name: Assemble GitHub Pages publication
        run: |
          rm -rf public
          mkdir -p public

          # Preserve the institutional site from the development branch.
          rsync -a ./ public/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='app-filha/' \
            --exclude='apps/' \
            --exclude='packages/' \
            --exclude='docs/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='*.md'

          # Publish the App FILHA independently at /virtuosa/app/.
          mkdir -p public/app
          rsync -a app-filha/dist/ public/app/

          # Add a clear entry point from the institutional site to the app.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          html = p.read_text(encoding='utf-8')
          button = '<li><a href="/virtuosa/app/" class="highlight-btn" aria-label="Entrar no App FILHA">Entrar no App</a></li>'
          if 'aria-label="Entrar no App FILHA"' not in html:
              marker = '<ul class="nav-links">'
              if marker in html:
                  html = html.replace(marker, marker + '\n                ' + button, 1)
              else:
                  html = html.replace('</body>', button + '</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

          touch public/.nojekyll
          touch public/app/.nojekyll
          test -f public/index.html
          test -f public/app/index.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true
