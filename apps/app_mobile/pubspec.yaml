name: filha
description: "FILHA - App espiritual para mulheres cristãs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design 3
  cupertino_icons: ^1.0.8
  google_fonts: ^7.0.0

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Routing
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0
  firebase_remote_config: ^4.3.0
  cloud_functions: ^4.6.0

  # API Integration
  dio: ^5.3.0

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.0
  json_serializable: ^6.7.1

  # Local Storage & Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.15
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^9.0.2
  geocoding: ^2.1.1

  # AI/OpenAI
  openai_dart: ^0.2.5

  # HTTP Client
  http: ^1.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.0
  provider: ^6.0.0

  # Image & Media
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Logging
  logger: ^2.0.0
  talker: ^3.2.0

  # Notifications
  awesome_notifications: ^0.9.2+1

  # PDF
  printing: ^5.11.0
  pdf: ^3.10.0

  # QR Code
  qr_flutter: ^4.0.0

  # Date & Time
  table_calendar: ^3.0.9
  time_picker_spinner_pop_up: ^1.0.8

  # Local packages
  design_system:
    path: ../../packages/design_system
  ui_components:
    path: ../../packages/ui_components
  shared:
    path: ../../packages/shared
  bible:
    path: ../../packages/bible
  ai:
    path: ../../packages/ai
  stickers:
    path: ../../packages/stickers

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700

    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
