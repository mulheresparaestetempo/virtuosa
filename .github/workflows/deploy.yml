name: Build App FILHA for GitHub Pages

on:
  push:
    branches:
      - claude/new-session-au1ezt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-filha/package-lock.json

      - name: Install App FILHA dependencies
        working-directory: app-filha
        run: npm ci

      - name: Build App FILHA for web
        working-directory: app-filha
        run: npx expo export -p web

      - name: Checkout main branch used by GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: main
          path: pages-main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish App FILHA into main/app
        run: |
          rm -rf pages-main/app
          mkdir -p pages-main/app
          rsync -a app-filha/dist/ pages-main/app/

          touch pages-main/.nojekyll
          touch pages-main/app/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages-main/index.html')
          html = p.read_text(encoding='utf-8')
          button = '<li><a href="/virtuosa/app/" class="highlight-btn" aria-label="Entrar no App FILHA">Entrar no App</a></li>'
          if 'aria-label="Entrar no App FILHA"' not in html:
              marker = '<ul class="nav-links">'
              if marker in html:
                  html = html.replace(marker, marker + '\n                ' + button, 1)
              else:
                  html = html.replace('</body>', button + '</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

          test -f pages-main/index.html
          test -f pages-main/app/index.html

      - name: Commit App FILHA to main
        working-directory: pages-main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .nojekyll index.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "deploy: publish App FILHA under /virtuosa/app"
            git push origin HEAD:main
          fi
