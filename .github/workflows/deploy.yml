name: Deploy Site + App FILHA

on:
  push:
    branches:
      - claude/new-session-au1ezt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-filha/package-lock.json

      - name: Install App FILHA dependencies
        working-directory: app-filha
        run: npm ci

      - name: Build App FILHA for web
        working-directory: app-filha
        run: npx expo export -p web

      - name: Assemble GitHub Pages site
        run: |
          rm -rf public
          mkdir -p public/app

          rsync -a ./ public/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='app-filha/' \
            --exclude='app-flutter/' \
            --exclude='apps/' \
            --exclude='packages/' \
            --exclude='docs/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='*.md' \
            --exclude='.vercelignore' \
            --exclude='public/'

          rsync -a app-filha/dist/ public/app/

          touch public/.nojekyll
          touch public/app/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<ul class="nav-links">'
          button = '<li><a href="/virtuosa/app/" class="highlight-btn" aria-label="Entrar no App FILHA">Entrar no App</a></li>'
          if marker in html and 'aria-label="Entrar no App FILHA"' not in html:
              html = html.replace(marker, marker + '\n                ' + button, 1)
          p.write_text(html, encoding='utf-8')
          PY

          echo 'Checking Pages files...'
          test -f public/index.html
          test -f public/app/index.html

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: true
